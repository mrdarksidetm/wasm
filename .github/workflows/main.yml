name: Android CI / Production Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Job 1: Static Code Analysis & Unit Testing
  code-analysis:
    name: Analysis & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --info --stacktrace
        continue-on-error: true

      - name: Upload Lint Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results*
          if-no-files-found: ignore

      - name: Upload Unit Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  # Job 2: Production Universal APK Assembly & Signing
  build-production-apk:
    name: Build Universal Production APK
    needs: code-analysis
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Production Signing Keystore
        id: setup-keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "Using production keystore from repository secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> $GITHUB_ENV
          elif git ls-remote --exit-code --heads origin ci-keystore >/dev/null 2>&1; then
            echo "Fetching existing permanent production keystore from origin/ci-keystore branch..."
            git fetch origin ci-keystore:ci-keystore
            git show ci-keystore:release.jks > keystore/release.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=wasm_production_secure_pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=wasm_release_key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=wasm_production_secure_pass" >> $GITHUB_ENV
            echo "Permanent production keystore reused successfully."
          else
            echo "No secret or branch keystore found. Generating permanent 2048-bit RSA production keystore..."
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias wasm_release_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "wasm_production_secure_pass" \
              -keypass "wasm_production_secure_pass" \
              -dname "CN=Wasm Android, OU=Mobile, O=Wasm, L=San Francisco, ST=CA, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=wasm_production_secure_pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=wasm_release_key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=wasm_production_secure_pass" >> $GITHUB_ENV

            # Persist keystore to ci-keystore branch so EVERY subsequent build reuses this exact key forever
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git branch -D ci-keystore 2>/dev/null || true
            git checkout --orphan ci-keystore
            git rm -rf . 2>/dev/null || true
            cp keystore/release.jks release.jks
            git add release.jks
            git commit -m "chore(ci): store permanent production signing keystore" || true
            git push origin ci-keystore || true
            git checkout -f "$GITHUB_SHA" || true

            # Package keystore and base64 string for user download
            mkdir -p keystore_export
            cp keystore/release.jks keystore_export/wasm-release.jks
            base64 -w 0 keystore/release.jks > keystore_export/wasm-release.jks.base64.txt 2>/dev/null || base64 keystore/release.jks > keystore_export/wasm-release.jks.base64.txt
            {
              echo "Wasm Production Keystore Credentials"
              echo "===================================="
              echo "KEYSTORE_PASSWORD: wasm_production_secure_pass"
              echo "KEY_ALIAS: wasm_release_key"
              echo "KEY_PASSWORD: wasm_production_secure_pass"
              echo ""
              echo "To make this keystore permanent in GitHub Secrets (optional, as CI automatically preserves it in ci-keystore branch):"
              echo "1. Open repo Settings > Secrets and variables > Actions"
              echo "2. Add secret KEYSTORE_BASE64 with content from wasm-release.jks.base64.txt"
              echo "3. Add secret KEYSTORE_PASSWORD = wasm_production_secure_pass"
              echo "4. Add secret KEY_ALIAS = wasm_release_key"
              echo "5. Add secret KEY_PASSWORD = wasm_production_secure_pass"
            } > keystore_export/CREDENTIALS.txt
            echo "HAS_GENERATED_KEYSTORE=true" >> $GITHUB_ENV
          fi

      - name: Build Universal Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_log.txt
          retention-days: 7

      - name: Push Build Diagnostics to Repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs || git checkout ci-logs
          git rm -rf . || true
          cp build_log.txt error_log.txt || true
          git add error_log.txt
          git commit -m "ci: publish build log" || true
          git push -f origin ci-logs || true

      - name: Verify Build Success
        run: |
          if ! grep -q "BUILD SUCCESSFUL" build_log.txt; then
            echo "## ❌ Build Universal Release APK Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Package Universal APK & Generate Checksum
        run: |
          cd app/build/outputs/apk/release
          # Rename output APK to standard descriptive universal release name
          ORIGINAL_APK=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$ORIGINAL_APK" ]; then
            cp "$ORIGINAL_APK" wasm-v0.3.0-universal-release.apk
            sha256sum wasm-v0.3.0-universal-release.apk > wasm-v0.3.0-universal-release.apk.sha256
            echo "Successfully packaged wasm-v0.3.0-universal-release.apk"
          else
            echo "Error: Release APK not found!" && exit 1
          fi

      - name: Verify APK Signatures & Alignment (Production-Ready Check)
        run: |
          APK_DIR="app/build/outputs/apk/release"
          APK_FILE="${APK_DIR}/wasm-v0.3.0-universal-release.apk"
          echo "Verifying APK alignment and production signing schemes..."
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --verbose "$APK_FILE"
            echo "✅ Production APK verified with v1 and v2/v3 signature schemes."
          else
            echo "apksigner not in path; verifying APK existence: OK"
          fi

      - name: Upload Standalone Universal APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-v0.3.0-universal-release-apk
          path: app/build/outputs/apk/release/wasm-v0.3.0-universal-release.apk
          retention-days: 30

      - name: Upload Standalone SHA256 Checksum (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-v0.3.0-universal-release-sha256
          path: app/build/outputs/apk/release/wasm-v0.3.0-universal-release.apk.sha256
          retention-days: 30

      - name: Publish Direct-Download Standalone APK & SHA256 (No Zip)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          echo "Publishing unzipped direct-download APK and checksum to GitHub Releases..."
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Wasm Production Universal Release (Direct Download)" \
            --notes "### 📱 Direct Standalone Download (No Unzipping Required)
          - **Production APK:** [wasm-v0.3.0-universal-release.apk](https://github.com/${{ github.repository }}/releases/download/$TAG/wasm-v0.3.0-universal-release.apk)
          - **SHA-256 Checksum:** [wasm-v0.3.0-universal-release.apk.sha256](https://github.com/${{ github.repository }}/releases/download/$TAG/wasm-v0.3.0-universal-release.apk.sha256)

          Click the APK link directly to download and test without extracting any zip files!" \
            --target "$GITHUB_SHA" \
            app/build/outputs/apk/release/wasm-v0.3.0-universal-release.apk \
            app/build/outputs/apk/release/wasm-v0.3.0-universal-release.apk.sha256

      - name: Upload Permanent Production Keystore Artifact
        if: env.HAS_GENERATED_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-permanent-production-keystore
          path: keystore_export/
          retention-days: 90

      - name: Workflow Run Summary
        if: always()
        run: |
          echo "## 🚀 Wasm Production Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** Universal (armeabi-v7a, arm64-v8a, x86, x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- **Binary:** \`wasm-v0.3.0-universal-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing:** Production Keystore (Single permanent key forever)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download (No Zip):** [Download wasm-v0.3.0-universal-release.apk](https://github.com/${{ github.repository }}/releases/download/latest-apk/wasm-v0.3.0-universal-release.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** [wasm-v0.3.0-universal-release.apk.sha256](https://github.com/${{ github.repository }}/releases/download/latest-apk/wasm-v0.3.0-universal-release.apk.sha256)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.HAS_GENERATED_KEYSTORE }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔑 Permanent Keystore Stored" >> $GITHUB_STEP_SUMMARY
            echo "A permanent 2048-bit RSA key was generated and preserved in the \`ci-keystore\` branch. All future builds will automatically reuse this exact key forever." >> $GITHUB_STEP_SUMMARY
          fi

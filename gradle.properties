# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# We limit the daemon memory to 1GB to leave room for the OS and IDE on 4GB RAM machines.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This can help build speed but might increase memory pressure. 
# We'll leave it off for now to prioritize stability on low RAM.
# org.gradle.parallel=true

# Enables configuration on demand for faster builds.
org.gradle.configureondemand=true

# Enable caching to avoid re-running tasks.
org.gradle.caching=true

# Kotlin optimization
kotlin.incremental=true
kotlin.code.style=official

# Enable AndroidX support
android.useAndroidX=true
